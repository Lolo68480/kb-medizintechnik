<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace équipe — KB Medizintechnik</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <img src="../logo-flag_vectorise-6.svg" alt="KB Medizintechnik">
      <div style="margin-top:16px">
        <span class="login-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Espace équipe interne
        </span>
      </div>
    </div>

    <h2>Connexion</h2>
    <p>Accès réservé au personnel de KB Medizintechnik.</p>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Adresse email</label>
        <input
          type="email"
          id="login-email"
          class="form-input"
          placeholder="prenom.nom@kbmedshop.ch"
          autocomplete="email"
          required
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">
          Mot de passe
          <a href="#" style="margin-left:auto;font-size:.78rem;font-weight:400;color:var(--primary)">Mot de passe oublié ?</a>
        </label>
        <div style="position:relative">
          <input
            type="password"
            id="login-password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted)"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group" style="flex-direction:row;align-items:center;gap:8px;margin-bottom:24px">
        <input type="checkbox" id="remember" style="accent-color:var(--primary);width:16px;height:16px;cursor:pointer">
        <label for="remember" style="font-size:.84rem;color:var(--text-muted);cursor:pointer">Rester connecté</label>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Se connecter
      </button>
    </form>

    <div class="login-back">
      <a href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour au site public
      </a>
    </div>

    <!-- Info sécurité -->
    <div style="margin-top:28px;padding:14px;background:var(--bg-light);border-radius:var(--radius);border:1px solid var(--border)">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" style="flex-shrink:0;margin-top:1px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <div style="font-size:.75rem;color:var(--text-muted);line-height:1.5">
          Connexion sécurisée HTTPS. Vos identifiants ne sont jamais partagés. En cas de problème d'accès, contactez l'administrateur.
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../js/i18n.js"></script><script src="../js/main.js"></script>
</body>
</html>
